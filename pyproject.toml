[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sqlcockpit"
version = "1.0.0"
description = "Zero-dependency terminal SQLite workbench: schema intelligence, SQL shell, import/export, diff, ER diagrams, health doctor and TUI"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "gitstq" }]
keywords = [
    "sqlite",
    "database",
    "cli",
    "terminal",
    "tui",
    "workbench",
    "zero-dependencies",
    "er-diagram",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/gitstq/SQLCockpit"
Documentation = "https://github.com/gitstq/SQLCockpit#readme"
Issues = "https://github.com/gitstq/SQLCockpit/issues"

[project.scripts]
sqlcockpit = "sqlcockpit.cli:main"

[tool.setuptools.packages.find]
include = ["sqlcockpit*"]
